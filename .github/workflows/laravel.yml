name: Laravel Production Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, fileinfo, pdo, pdo_mysql, bcmath, tokenizer
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Vite assets
        run: bun run build

      - name: Prepare production package
        run: |
          mkdir -p dist
          zip -r dist/laravel-production.zip . \
            -x ".git/*" \
               ".github/*" \
               "node_modules/*" \
               "tests/*" \
               ".env" \
               ".env.*" \
               "dist/*" \
               "storage/logs/*" \
               "storage/framework/cache/data/*" \
               "storage/framework/sessions/*" \
               "storage/framework/views/*"

      - name: Upload production ZIP
        uses: actions/upload-artifact@v4
        with:
          name: laravel-production
          path: dist/laravel-production.zip
          retention-days: 7
